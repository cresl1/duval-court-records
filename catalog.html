<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Law Library Catalog</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Library Catalog">
<meta name="theme-color" content="#0b2545">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1c2433; --sub:#4d5464;
    --navy:#0b2545; --navy2:#13315c; --gold:#8a6520; --gold-soft:rgba(179,137,60,.14);
    --sep:rgba(28,36,51,.12); --hair:rgba(138,101,32,.45); --focus:#8a6520;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117; --card:#161c26; --ink:#eceef2; --sub:#a8b1bd;
      --navy:#12233d; --navy2:#1a3054; --gold:#d3b169; --gold-soft:rgba(201,164,90,.12);
      --sep:rgba(236,238,242,.14); --hair:rgba(211,177,105,.30); --focus:#d3b169;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:420px; width:100%; text-align:center}
  .crest{
    width:3.25rem; height:3.25rem; border-radius:50%;
    background:linear-gradient(180deg,var(--navy2),var(--navy));
    display:flex; align-items:center; justify-content:center; margin:0 auto 0.9rem;
    box-shadow:0 4px 14px rgba(11,37,69,.30), inset 0 0 0 1.5px var(--hair);
  }
  .eyebrow{font-size:0.6875rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); font-weight:700; margin:0}
  h1{font-family:Georgia,"Times New Roman",serif; font-size:1.5rem; font-weight:600; margin:0.375rem 0 0; line-height:1.25}
  p{color:var(--sub); font-size:0.875rem; line-height:1.55; margin:0.625rem 0 0}
  .card{background:var(--card); border-radius:1rem; padding:1.25rem; margin-top:1.25rem; box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .btn{
    display:flex; align-items:center; justify-content:center; width:100%;
    padding:1rem; border-radius:0.875rem; border:0;
    background:linear-gradient(180deg,var(--navy2),var(--navy)); color:#fff;
    font-size:1rem; font-weight:600; text-decoration:none; cursor:pointer; min-height:3rem;
  }
  .btn:active{transform:scale(.985)}
  a.quiet{display:inline-block; margin-top:0.875rem; color:var(--gold); font-size:0.8125rem; text-decoration:none}
  a.quiet:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
  .rule{height:1px; background:linear-gradient(90deg,transparent,var(--hair) 18%,var(--hair) 82%,transparent); margin:1rem 0}
  .foot{font-size:0.75rem; color:var(--sub); margin-top:1rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="crest" aria-hidden="true">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#c9a45a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    </svg>
  </div>
  <p class="eyebrow">Duval County Law Library</p>
  <h1>Library Catalog</h1>
  <p>Connecting you to the library's catalog. The first search page may take a moment to load.</p>

  <div class="card">
    <form id="go" method="POST" action="https://opac.libraryworld.com/opac/signin.php" target="_blank" rel="noopener">
      <input type="hidden" name="libraryname" value="dcll">
      <input type="hidden" name="password" value="">
      <noscript><button class="btn" type="submit">Open the catalog</button></noscript>
    </form>
    <a class="btn" id="manual" href="https://opac.libraryworld.com/opac/" target="_blank" rel="noopener" style="display:none">Open the catalog</a>
    <a class="quiet" href="https://opac.libraryworld.com/opac/" target="_blank" rel="noopener">Open the OPAC login instead</a>
  </div>

  <div class="rule"></div>
  <p class="foot">LibraryWorld patron catalog. No password needed for the Duval County Law Library.</p>
</div>

<script>
// Auto-connect to the dcll catalog, then hand the user to it.
(function(){
  var f=document.getElementById('go');
  try{ f.submit(); }catch(e){}
  // If submission is blocked, show the manual button.
  setTimeout(function(){
    document.getElementById('manual').style.display='flex';
    var n=f.querySelector('noscript'); if(n){ n.style.display='none'; }
  }, 1200);
})();
</script>
</body>
</html>
